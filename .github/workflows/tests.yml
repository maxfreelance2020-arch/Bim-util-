name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bmp-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
      - name: Build and test all tasks
        run: cmake --build build/ci --target check --parallel
